# Bulk silicon in the diamond structure, run as constant-temperature MD.
#
#   fastatoms-run examples/silicon.yaml 3.0
#   python python/examples/read_input.py examples/silicon.yaml

structure:
  # Any of these spellings work:
  #   cell: 5.43                                   (cubic)
  #   cell: [5.43, 5.43, 5.43]                     (orthorhombic)
  #   cell: [5.43, 5.43, 5.43, 90, 90, 90]         (lattice parameters)
  cell: {a: 5.43, b: 5.43, c: 5.43, alpha: 90, beta: 90, gamma: 90}
  pbc: [true, true, true]
  coordinates: fractional
  symbols: [Si, Si, Si, Si, Si, Si, Si, Si]
  positions:
    - [0.00, 0.00, 0.00]
    - [0.00, 0.50, 0.50]
    - [0.50, 0.00, 0.50]
    - [0.50, 0.50, 0.00]
    - [0.25, 0.25, 0.25]
    - [0.25, 0.75, 0.75]
    - [0.75, 0.25, 0.75]
    - [0.75, 0.75, 0.25]

simulation:
  task: md
  calculator:
    name: stillinger_weber
    parameters:
      cutoff: 3.77118
  md:
    ensemble: nvt
    thermostat: langevin
    timestep: 1.0          # fs
    steps: 5000
    temperature: 300.0     # K
    friction: 0.01         # 1/fs
    seed: 20260829
    initialize_velocities: true
  output:
    trajectory: si_md.yaml
    log: si_md.log
    interval: 50
