# SPDX-License-Identifier: MIT
[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "fastatoms"
version = "0.1.2"
description = "High-performance C++ core for atomistic simulations, driven from Python"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
ase = ["ase>=3.22"]

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/fastatoms"]

# A wheel carries only the extension module and the package sources: no static
# library, no headers, no CMake package files, no test binaries.
[tool.scikit-build.cmake.define]
FASTATOMS_INSTALL = "OFF"
FASTATOMS_BUILD_TESTS = "OFF"
FASTATOMS_BUILD_EXAMPLES = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# Keep pytest's scratch out of the source tree. Without this, running the
# suite from the repository root drops a .pytest_cache/ directory beside the
# sources; PYTHONDONTWRITEBYTECODE in tests/CMakeLists.txt covers the
# __pycache__/ that would otherwise appear under tests/python. Everything
# generated belongs under build/, the one directory this project discards.
cache_dir = "build/.pytest_cache"

[tool.ruff]
line-length = 100
