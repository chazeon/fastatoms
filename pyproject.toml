# SPDX-License-Identifier: MIT
#
# Python test harness for the C++ core. The pybind11 module is for testing
# only and is not published to PyPI.
#
#   uv sync          build and install fastatoms with the dev group
#   uv run pytest    run the parity suite in tests/py
#   uv sync --reinstall-package fastatoms   rebuild after C++ changes
#
# Point the build at existing gemmi / vesin checkouts so nothing is downloaded:
#
#   export SKBUILD_CMAKE_DEFINE="FASTATOMS_GEMMI_SOURCE_DIR=...;FASTATOMS_VESIN_SOURCE_DIR=..."
#
# See bindings/python/README.md for details.

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "fastatoms"
version = "0.3.0"
description = "Test-only pybind11 bindings for the fastatoms C++ core (not for PyPI)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ase>=3.23",
    "vesin>=0.4",
    "spglib>=2.5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pybind11-stubgen>=2.5",
]

[tool.uv]
package = true

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["bindings/python/fastatoms"]

[tool.scikit-build.cmake.define]
FASTATOMS_BUILD_PYTHON = "ON"
FASTATOMS_BUILD_TESTS = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests/py"]
cache_dir = "build/.pytest_cache"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["bindings/python", "tests/py"]
# python/ and tests/python are the unbuilt legacy package; leave them alone.
extend-exclude = [".claude", "build", "js", "python", "tests/python"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["fastatoms"]

[tool.mypy]
strict = true
files = ["bindings/python/fastatoms", "tests/py"]
mypy_path = ["bindings/python", "tests/py"]

# vesin ships no type information; ase and spglib do (py.typed).
[[tool.mypy.overrides]]
module = ["vesin", "vesin.*"]
ignore_missing_imports = true
